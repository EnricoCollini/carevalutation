name: calcolatore-auto

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-calcolatore_auto}
      MYSQL_USER: ${MYSQL_USER:-calcolatore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Imposta MYSQL_ROOT_PASSWORD nel file .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-calcolatore_auto}
      MYSQL_USER: ${MYSQL_USER:-calcolatore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env}
      SECRET_KEY: ${SECRET_KEY:?Imposta SECRET_KEY nel file .env}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
